version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: anchor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: anchor_user
      POSTGRES_PASSWORD: anchor_password_2026
      POSTGRES_DB: anchor_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anchor_user -d anchor_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: anchor-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: anchor-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://anchor_user:anchor_password_2026@db:5432/anchor_db?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: anchor_jwt_production_secret_2026_super_secure_key
      JWT_EXPIRES_IN: 7d
      FRONTEND_URL: http://localhost:8443
      META_VERIFY_TOKEN: anchor_meta_verify_token_2026
      META_APP_SECRET: mock_meta_app_secret_anchor_2026
    ports:
      - "5000:5000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anchor-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8443:80"

volumes:
  postgres_data:
  redis_data:
